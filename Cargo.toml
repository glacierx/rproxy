[package]
name = "rproxy"
version = "0.3.3"
authors = ["Rong Xian <rong.xian@gmail.com>"]
description = "Platform independent asynchronous UDP/TCP proxy"
homepage = "https://github.com/glacierx/rproxy"
repository = "https://github.com/glacierx/rproxy"
readme = "README.md"
keywords = ["proxy", "TCP", "UDP", "async","openvpn"]
categories = ["command-line-utilities", "network-programming"]
license = "MIT"
edition = "2021"
exclude = [
    ".gitignore",
    "Cargo.toml.orig",
    "Cargo.lock",
]

[[bin]]
name = "rproxy"
path = "src/main.rs"

[[bin]]
name = "rproxy-edit"
path = "src/bin/editor/main.rs"

[lib]
name = "rproxy"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.51", features = ["full"] }
log4rs = "1.4"
futures = "0.3"
crossbeam = "0.8"
log = { version = "0.4", features = ["std", "serde"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argh = "0.1"
socket2 = "0.6"
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "user"] }
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
#strip = true  # Automatically strip symbols from the binary.
opt-level = 3
lto = true
codegen-units = 1